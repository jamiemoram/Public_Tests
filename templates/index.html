<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Freshbins Customer Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <!--<nav class="navbar bg-white">-->
    <!--  <div class="container">-->
    <!--    <a class="navbar-brand" href="#">-->
    <!--     <img src="{{ url_for('static', filename='images/logo-largest-transparent.png') }}" alt="Freshbins Logo" style="width: 300px;">-->
    <!--    </a>-->
    <!--  </div>-->
    <!--</nav>-->
    <main class="p-3">
         <!--Logo Section-->
        <div class="logo-container" style="text-align: center; margin-bottom: 20px;">
            <img src="{{ url_for('static', filename='images/logo-largest-transparent.png') }}" alt="Freshbins Logo" style="width: 300px;">
            <!--<h2>Family Owned & Operated Since 2003</h2>-->
        </div>
        <h1 class="text-center text-secondary">Freshbins Scheduling - Select Your Address</h1>

        <!-- Postcode input label and search button -->
        <div class="mb-3 dropdown-container">
            <label for="postcodeInput">Enter Postcode:</label>
            <input class="form-control mb-2" type="text" id="postcodeInput" placeholder="Enter Postcode..." autocomplete="off">
        </div>
        <button class="btn btn-primary" id="searchPostcode">Search</button>

        <!-- Dropdown for matching postcodes -->
        <div class="py-2 mb-3 dropdown-container" id="postcodeResultsDropdown" style="display: none;">
            <label for="postcodeResults">Pick an address:</label>
            <select id="postcodeResults" class="form-control">
                <option disabled selected>Select an address</option>  <!-- Dropdown prompt -->
            </select>
        </div>

        <!-- Table for displaying detailed results -->
        <table id="resultsTable" class="table" style="display: none;">
            <thead>
                <tr>
                    <th>Customer ID</th>
                    <th>Postcode</th>
                    <th>Street Name</th>
                    <th>House Name/Number</th>
                    <th>Bin</th>
                    <th>Date</th>
                </tr>
            </thead>
            <tbody class="table-group-divider" id="resultsBody"></tbody>
        </table>
    </main>

    <script>
        // Handle search button click to fetch postcode matches
        document.getElementById('searchPostcode').addEventListener('click', function () {
            const postcode = document.getElementById('postcodeInput').value;

            if (postcode) {
                // Send AJAX request to the Flask backend to get matching postcodes
                fetch('/get_postcode_matches', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/x-www-form-urlencoded',
                    },
                    body: new URLSearchParams({ postcode })
                })
                .then(response => response.json())
                .then(data => {
                    const resultsDropdown = document.getElementById('postcodeResultsDropdown');
                    const resultsSelect = document.getElementById('postcodeResults');

                    // Clear existing options
                    resultsSelect.innerHTML = '<option disabled selected>Select an address</option>';

                    // Populate dropdown with results
                    data.matches.forEach(item => {
                        const option = document.createElement('option');
                        option.value = item.id;  // Use the customer ID
                        option.textContent = `${item.postcode}, ${item.street}, ${item.house}`;
                        resultsSelect.appendChild(option);
                    });

                    // Show dropdown
                    resultsDropdown.style.display = 'block';
                })
                .catch(error => console.error('Error fetching postcode matches:', error));
            }
        });

        // Handle dropdown selection to fetch detailed address data and disable inputs
        document.getElementById('postcodeResults').addEventListener('change', function () {
            const selectedId = this.value;

            // Send AJAX request to get detailed information about the selected entry
            fetch('/get_address_data', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded',
                },
                body: new URLSearchParams({ id: selectedId })
            })
            .then(response => response.json())
            .then(data => {
                const resultsTable = document.getElementById('resultsTable');
                const resultsBody = document.getElementById('resultsBody');

                // Clear existing table rows
                resultsBody.innerHTML = '';

                // Populate the table with the detailed data
                const row = `<tr>
                                <td>${data.customerId}</td>
                                <td>${data.postcode}</td>
                                <td>${data.street}</td>
                                <td>${data.house}</td>
                                <td>${data.bin}</td>
                                <td>${data.date}</td>
                            </tr>`;
                resultsBody.innerHTML = row;

                // Show the table
                resultsTable.style.display = 'table';

                // Disable all input fields after selection
                document.getElementById('postcodeInput').disabled = true;
                document.getElementById('searchPostcode').disabled = true;
                document.getElementById('postcodeResults').disabled = true;
            })
            .catch(error => console.error('Error fetching address data:', error));
        });
    </script>
</body>
</html>
